name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Prove Mega Skills Branch Lifecycle Intelligence
        run: python proof/branch-lifecycle/tests/test_branch_lifecycle.py -v
      - run: python scripts/operate.py
